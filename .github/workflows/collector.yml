name: AQI Auto Collector

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Call AQI Collector API
        run: |
          curl -sf "${{ secrets.COLLECTOR_API_URL }}/api/GetRealtimeData?lat=21.0152&lon=105.7999" \
            || echo "Collector call failed – will retry on next schedule"
